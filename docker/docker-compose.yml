version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:2.4.0-rc2
    container_name: evolution-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: http://143.95.212.87:8080
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: cariocas-pro-evolution-key-2026

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"

      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_GLOBAL_URL: http://143.95.212.87/api/whatsapp/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_GLOBAL_WEBHOOK_BASE64: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"

      DEL_INSTANCE: "false"
      QRCODE_LIMIT: 60
      CONFIG_BAILEYS_VERSION: "2.3000.1047113681"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      LOG_LEVEL: "ERROR,WARN,DEBUG,INFO,LOG,VERBOSE"
      LOG_BAILEYS: debug
      LOG_SAVE: "true"

      REDIS_ENABLED: "false"
      CACHE_REDIS_DISABLED: "true"

    volumes:
      - ./evolution-instances:/evolution/instances

    extra_hosts:
      - "host.docker.internal:host-gateway"
